name: Build Telegram APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      APP_PACKAGE: com.nxc.fighter

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Create dummy google-services.json
        run: |
          cat > TMessagesProj_App/google-services.json << JSON
          {"project_info":{"project_number":"1","project_id":"dummy","storage_bucket":"dummy.appspot.com"},
           "client":[
            {"client_info":{"mobilesdk_app_id":"1:1:android:1","android_client_info":{"package_name":"$APP_PACKAGE"}},"api_key":[{"current_key":"dummy"}]},
            {"client_info":{"mobilesdk_app_id":"1:1:android:2","android_client_info":{"package_name":"$APP_PACKAGE.beta"}},"api_key":[{"current_key":"dummy"}]},
            {"client_info":{"mobilesdk_app_id":"1:1:android:3","android_client_info":{"package_name":"$APP_PACKAGE.web"}},"api_key":[{"current_key":"dummy"}]}
           ],"configuration_version":"1"}
          JSON

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :TMessagesProj_App:assembleAfatDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-apk
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
